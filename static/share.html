<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoClipper Share</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f11;color:#e5e7eb;min-height:100vh}
  header{background:#18181b;border-bottom:1px solid #27272a;padding:18px 24px;display:flex;align-items:center;gap:16px}
  .logo{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#a78bfa}
  h1{font-size:17px;font-weight:600;flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;text-decoration:none}
  .btn-p{background:#7c3aed;color:#fff}.btn-p:hover{background:#6d28d9}
  .btn-g{background:#27272a;color:#e5e7eb}.btn-g:hover{background:#3f3f46}
  main{max-width:1100px;margin:0 auto;padding:24px 16px}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .count{font-size:13px;color:#71717a;flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#18181b;border:1px solid #27272a;border-radius:12px;overflow:hidden;transition:.2s}
  .card:hover{border-color:#7c3aed;transform:translateY(-2px)}
  video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block}
  .card-body{padding:12px}
  .clip-title{font-size:13px;font-weight:600;margin-bottom:5px;line-height:1.3}
  .clip-desc{font-size:11px;color:#9ca3af;line-height:1.45;margin-bottom:7px}
  .clip-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .clip-tag{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);color:#a78bfa;padding:2px 6px;border-radius:4px;font-size:10px}
  .card-actions{display:flex;gap:6px}
  #loading{text-align:center;padding:60px;color:#71717a}
  footer{text-align:center;padding:32px;color:#3f3f46;font-size:12px}
  @media(max-width:500px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <span class="logo">▶ VideoClipper</span>
  <h1 id="proj-title">Загрузка…</h1>
  <div>
    <a id="btn-zip" href="#" class="btn btn-p" download>⬇ Скачать все (ZIP)</a>
  </div>
</header>
<main>
  <div class="toolbar">
    <span class="count" id="count-label"></span>
    <input id="search" placeholder="🔍 Поиск по названию…"
      style="padding:7px 12px;border-radius:8px;border:1px solid #3f3f46;background:#27272a;color:#e5e7eb;font-size:13px;width:220px"
      oninput="filterClips(this.value)">
  </div>
  <div id="loading">Загружаем клипы…</div>
  <div class="grid" id="grid" style="display:none"></div>
</main>
<footer>Создано с VideoClipper &nbsp;•&nbsp; <span id="created"></span></footer>

<script>
const TOKEN = location.pathname.split('/').pop();
let ALL = [];

async function init() {
  document.getElementById('btn-zip').href = `/api/share/${TOKEN}/zip`;
  const r = await fetch(`/api/share/${TOKEN}/clips`);
  if (!r.ok) { document.getElementById('loading').textContent = 'Ссылка не найдена.'; return; }
  const d = await r.json();
  document.getElementById('proj-title').textContent = d.title;
  document.title = d.title;
  const dt = new Date(d.created_at);
  document.getElementById('created').textContent =
    dt.toLocaleDateString('ru-RU', {day:'2-digit', month:'long', year:'numeric'});
  ALL = d.clips;
  renderClips(ALL);
}

function renderClips(clips) {
  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('grid');
  grid.style.display = '';
  document.getElementById('count-label').textContent = clips.length + ' клипов';
  grid.innerHTML = clips.map(c => `
    <div class="card">
      <video src="${esc(c.url)}" preload="metadata" controls playsinline></video>
      <div class="card-body">
        <div class="clip-title">${esc(c.title)}</div>
        ${c.description ? `<div class="clip-desc">${esc(c.description)}</div>` : ''}
        ${c.tags && c.tags.length ? `<div class="clip-tags">${c.tags.slice(0,6).map(t=>`<span class="clip-tag">#${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="card-actions">
          <a href="${esc(c.download)}" download class="btn btn-g" style="flex:1;justify-content:center">⬇ Скачать</a>
        </div>
      </div>
    </div>`).join('');
}

function filterClips(q) {
  const lq = q.toLowerCase();
  renderClips(q ? ALL.filter(c => c.title.toLowerCase().includes(lq)) : ALL);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
